apiVersion: 1
datasources:
  - name: ClickHouse DNP3
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: grafana
      defaultDatabase: dnp3
    secureJsonData:
      password: $GRAFANA_CH_PASSWORD
